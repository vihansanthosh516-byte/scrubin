[project]
name = "scrubin-engine"
version = "0.1.0"
description = "Real-time operating room simulation engine for ScrubIn"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scrubin_engine*"]

[tool.setuptools.package-data]
scrubin_engine = ["**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
